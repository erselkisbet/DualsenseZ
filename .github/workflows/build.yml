name: WinUI Release x64
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core and WinUI
        shell: pwsh
        run: ./scripts/build-winui.ps1 -Clean
      - name: Core tests
        shell: pwsh
        working-directory: build
        run: ./CoreBoundaryTests.exe
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DualsenseZ-win-x64
          path: dist/*.zip
          if-no-files-found: error
